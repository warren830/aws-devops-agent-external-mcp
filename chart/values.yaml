# ============================================================================
# Global defaults — shared by all accounts. Override per-account in
# values-<account>.yaml.
# ============================================================================

namespace: mcp
# Render the Namespace object? Default false because multiple releases usually
# share one namespace and Helm's ownership metadata conflicts. See
# templates/namespace.yaml for details. Enable for FIRST release only.
createNamespace: false

image:
  repository: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/aws-devops-agent-external-mcp
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1    # 低流量账号单副本即可。高流量/生产账号在 values-<acct>.yaml 覆盖为 2+

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { cpu: 500m, memory: 512Mi }

ingress:
  enabled: true
  # Every account's Ingress uses the same group name → ALB Controller merges
  # them into ONE ALB with multiple host-based rules.
  groupName: mcp
  scheme: internal       # internal | internet-facing
  certificateArn: arn:aws:acm:us-east-1:<ACCOUNT_ID>:certificate/74d2cea3-a33c-4841-920b-1d878a629c3a

mcpServer:
  # aws-api-mcp-server defaults. For non-AWS flavors (e.g. aliyun) override
  # command/env in values-<account>.yaml.
  command: ["python", "-m", "awslabs.aws_api_mcp_server.server"]
  port: 8000
  # Stateless HTTP: each request carries full context; enables multi-replica HA.
  # Without this, session state split across pods causes "Session not found".
  statelessHttp: true
  authType: no-auth

# ----------------------------------------------------------------------------
# Auth mode — how the MCP Server obtains AWS credentials for its target account
# ----------------------------------------------------------------------------
#   ak_sk          — long-lived AccessKey/SecretKey (default; fine for the
#                    global-partition account itself, or aliyun).
#   roles_anywhere — X.509 client cert → Hub temp creds → sts:AssumeRole into a
#                    spoke account. Zero long-lived keys. This is the ONLY way a
#                    cluster running in the `aws` (global) partition can reach
#                    `aws-cn` accounts, because the cluster's own IRSA identity
#                    can't AssumeRole across partitions.
#                    See docs/deploy/DEPLOY-ROLES-ANYWHERE.md.
auth:
  mode: ak_sk        # ak_sk | roles_anywhere

# Only consumed when auth.mode = roles_anywhere. The cert+key are delivered as a
# volume-mounted Secret (NOT env vars), so they never appear in the pod spec.
rolesAnywhere:
  # Hub-account Roles Anywhere endpoints + role (all in the cn partition).
  trustAnchorArn: ""    # arn:aws-cn:rolesanywhere:cn-northwest-1:HUB:trust-anchor/...
  profileArn: ""        # arn:aws-cn:rolesanywhere:cn-northwest-1:HUB:profile/...
  hubRoleArn: ""        # arn:aws-cn:iam::HUB:role/mcp-roles-anywhere-hub
  # Spoke role to AssumeRole into — the account whose APIs we actually call.
  spokeRoleArn: ""      # arn:aws-cn:iam::SPOKE:role/mcp-spoke-readonly
  # Region of the Roles Anywhere endpoint + AssumeRole call (the HUB region).
  # Distinct from account.awsRegion, which is the SPOKE's API region.
  region: ""            # e.g. cn-northwest-1
  externalId: mcp-bridge
  # Read-only mount point for the cert/key files. credential-helper.sh reads:
  #   <certMountPath>/client.crt  and  <certMountPath>/client.key
  # MUST differ from /app/certs — entrypoint-ra.sh writes the SDK config there
  # (writable Dockerfile dir); a read-only mount over it would break the write.
  certMountPath: /app/ra-certs
  # ESO source: a Secrets Manager key holding JSON {"cert": "<PEM>", "key": "<PEM>"}.
  # Requires externalSecrets.enabled=true.
  certSecretsManagerKey: ""   # e.g. /mcp/ra-cert-bundle

# ----------------------------------------------------------------------------
# External Secrets Operator integration (Phase 2)
# ----------------------------------------------------------------------------
# When enabled=true, chart renders an ExternalSecret that ESO reconciles into
# a K8s Secret. When enabled=false, chart expects account.existingSecret to
# already exist (managed manually).
externalSecrets:
  enabled: false
  secretStoreName: aws-secrets-manager     # ClusterSecretStore name
  refreshInterval: 1h

# ----------------------------------------------------------------------------
# Per-account — MUST be set in values-<account>.yaml
# ----------------------------------------------------------------------------
account:
  # Short identifier, used in resource names. Lowercase, alphanumeric+dash.
  name: ""                  # e.g. "aws-global", "aws-cn", "aws-cn-prod"

  # AWS region the MCP Server will default to.
  awsRegion: ""             # e.g. "us-east-1", "cn-north-1"

  # External hostname. Ingress matches on this; MCP Server restricts Host/Origin.
  host: ""                  # e.g. "aws-global.yingchu.cloud"

  # Mode A (externalSecrets.enabled=false): name of pre-existing K8s Secret.
  existingSecret: ""        # e.g. "mcp-creds"

  # Mode A: which keys inside the existing secret hold the credentials.
  secretKeys:
    AWS_ACCESS_KEY_ID: ""       # e.g. "AWS_GLOBAL_AK"
    AWS_SECRET_ACCESS_KEY: ""   # e.g. "AWS_GLOBAL_SK"

  # Mode B (externalSecrets.enabled=true): Secrets Manager key path. ESO will
  # fetch this secret and create a K8s Secret. Expected JSON structure:
  #   { "AK": "AKIA...", "SK": "..." }
  secretsManagerKey: ""     # e.g. "/mcp/aws-global"

  # Extra environment variables (non-credential). Useful for aliyun flavors or
  # other tweaks.
  extraEnv: []
  # Example:
  # extraEnv:
  #   - name: SOME_VAR
  #     value: "foo"
