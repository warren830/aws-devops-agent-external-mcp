{{- if .Values.externalSecrets.enabled -}}
{{- if eq .Values.auth.mode "roles_anywhere" -}}
# Roles Anywhere mode: ESO reconciles the X.509 cert bundle into a K8s Secret
# whose keys (client.crt, client.key) the deployment mounts as files. ESO reads
# the source via the pod's IRSA identity (global partition) — no AK/SK anywhere.
#
# Secrets Manager secret expected format (JSON string):
#   {"cert": "-----BEGIN CERTIFICATE-----\n...", "key": "-----BEGIN ... KEY-----\n..."}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "mcp.fullname" . }}-ra-certs
  namespace: {{ .Values.namespace }}
  labels: {{- include "mcp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "mcp.fullname" . }}-ra-certs
    creationPolicy: Owner
  data:
    # secretKey becomes the FILENAME under the mounted volume. Must match the
    # client.crt / client.key paths RA_CERT_PATH / RA_KEY_PATH point at.
    - secretKey: client.crt
      remoteRef:
        key: {{ required "rolesAnywhere.certSecretsManagerKey must be set when auth.mode=roles_anywhere and externalSecrets.enabled=true" .Values.rolesAnywhere.certSecretsManagerKey }}
        property: cert
    - secretKey: client.key
      remoteRef:
        key: {{ .Values.rolesAnywhere.certSecretsManagerKey }}
        property: key
{{- else -}}
# AK/SK mode: ESO reconciles this into a K8s Secret named mcp.secretName,
# fetching credentials from AWS Secrets Manager via the ClusterSecretStore.
#
# Secrets Manager secret expected format (JSON string):
#   {"AK": "AKIA...", "SK": "..."}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "mcp.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels: {{- include "mcp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "mcp.fullname" . }}
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ required "account.secretsManagerKey must be set when externalSecrets.enabled=true" .Values.account.secretsManagerKey }}
        property: AK
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.account.secretsManagerKey }}
        property: SK
{{- end -}}
{{- end }}
